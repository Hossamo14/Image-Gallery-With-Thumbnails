<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallary</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
</head>

<body>
    <h1>Image Gallary</h1>
    <div class="slider-container">
        <button class="prev-btn">Previous</button>
        <div class="slider">
            <div class="img-id">Image 1 of 7</div>
            <img class="active" src="images/Living (1).jpg" alt="Image 1">
            <img src="images/Living (2).jpg" alt="Image 2">
            <img src="images/Living (3).jpg" alt="Image 3">
            <img src="images/Living (4).jpg" alt="Image 4">
            <img src="images/Living (5).jpg" alt="Image 5">
            <img src="images/Living (6).jpg" alt="Image 6">
            <img src="images/Living (7).jpg" alt="Image 7">

        </div>
        <button class="next-btn">Next</button>
    </div>
    <div class="gallery-container"></div>
    <script src="main.js"></script>
</body>

</html>
